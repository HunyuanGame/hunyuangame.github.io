<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>Hunyuan Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @font-face {
            font-family: "TencentSans";
            font-style: normal;
            src: url("./assets/fonts/TencentSans-W3.ttf") format("truetype");
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #05070a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(58, 160, 255, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(124, 93, 255, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            min-height: 100vh;
            font-family: "TencentSans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }

        .main-card {
            width: min(1000px, 92vw);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            animation: fadeIn 0.8s ease-out;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero {
            text-align: center;
            max-width: 800px;
        }

        .hero h1 {
            margin: 0 0 16px 0;
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 800;
            background: linear-gradient(to bottom, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .hero p {
            margin: 0 0 28px 0;
            line-height: 1.6;
            color: rgba(200, 210, 230, 0.8);
            font-size: 18px;
            word-break: break-all;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            padding: 14px 36px;
            border-radius: 100px;
            background: #ffffff;
            color: #05070a;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }

        .cta:hover {
            transform: scale(1.05);
            background: #f8fafc;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .video-container {
            width: 100%;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 20px 50px rgba(0, 0, 0, 0.5);
            background: #000;
        }

        .video-container video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 装饰元素 */
        .glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(124, 93, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
        }

        .glow-1 { top: -100px; left: -100px; }
        .glow-2 { bottom: -100px; right: -100px; }

        /* 移动端适配 */
        @media (max-width: 768px) {
            body {
                padding: 0;
                overflow-y: auto; /* 手机端如果卡片太长，允许纵向滚动 */
                align-items: center; /* 确保垂直居中 */
            }

            .main-card {
                width: 90vw;
                padding: 32px 20px;
                gap: 24px;
                border-radius: 20px;
                margin: 20px 0; /* 给上下留点空隙，避免贴边 */
            }

            .hero h1 {
                font-size: 28px;
                margin-bottom: 12px;
            }

            .hero p {
                font-size: 15px;
                margin-bottom: 20px;
                padding: 0 10px;
            }

            .cta {
                padding: 12px 28px;
                font-size: 15px;
                width: 100%;
                justify-content: center;
            }

            .video-container {
                border-radius: 12px;
            }
        }

    </style>
</head>

<body class="single-video-page">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    
    <main class="main-card">
        <section class="hero">
            <h1 data-i18n="title">&nbsp;</h1>
            <p data-i18n="desc">&nbsp;</p>
            <a class="cta" href="https://hunyuan.tencent.com/game" target="_blank" rel="noopener noreferrer" data-i18n="cta">&nbsp;</a>
        </section>

        <div class="video-container">
            <video controls autoplay loop muted playsinline
                src="https://hy-game-prod-1258344703.cos.ap-guangzhou.myqcloud.com/public/hunyuan-game-video.mp4">
                您的浏览器不支持视频播放。
            </video>
        </div>
    </main>

                <script>
        (function () {
            const dict = {
                zh: {
                    title: "混元游戏",
                    desc: "混元游戏 3.0 正式发布！重塑游戏内容创作交互新范式 🎮持续优化设计师工作流，全面赋能创作提效升级。",
                    cta: "立即体验"
                },
                en: {
                    title: "HYGame",
                    desc: "HYGame 3.0 is live! We are shifting the interaction paradigm for game content creation. 🎮 Our core focus remains the continuous optimization of designers' workflows.",
                    cta: "Try It Now"
                }
            };

            const browserLang = (navigator.language || "en").toLowerCase();
            const preferred = browserLang.startsWith("zh") ? "zh" : "en";
            const texts = dict[preferred];

            document.title = texts.title;
            document.querySelectorAll("[data-i18n]").forEach((el) => {
                const key = el.dataset.i18n;
                if (texts[key]) el.textContent = texts[key];
            });
        })();
                </script>
</body>

</html>
